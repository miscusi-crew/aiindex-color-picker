<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Image Color Picker</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="base.css">
<style>
  main{max-width:56rem}
  .drop{display:grid;place-items:center;gap:.5rem;padding:1.5rem;border:2px dashed var(--line);border-radius:.9rem;text-align:center;color:var(--muted);margin:.75rem 0}
  .drop.over{border-color:var(--accent)}
  canvas{display:block;max-width:100%;border-radius:.5rem;cursor:crosshair;margin:.5rem 0}
  .picked{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
  .sw{width:4rem;height:4rem;border-radius:.6rem;border:1px solid var(--line)}
  .vals{font-family:ui-monospace,Menlo,Consolas,monospace;display:grid;gap:.2rem}
  .vals button{text-align:left;border:0;background:transparent;padding:0;font:inherit;color:var(--fg)}
  .main{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.5rem}
  .main button{width:4.5rem;height:3.2rem;border-radius:.5rem;border:1px solid var(--line);font:600 .7rem ui-monospace,Menlo,monospace;padding:0}
</style>
</head>
<body>
<main>
  <h1>Image Color Picker</h1>
  <p class="sub">Open a photo, then click anywhere on it. The photo never leaves your device.</p>
  <label class="drop" id="drop">
    <span>Drop an image here, or</span>
    <input type="file" id="file" accept="image/*">
  </label>
  <canvas id="canvas" width="0" height="0" aria-label="Your image; click to pick a colour"></canvas>
  <div class="picked">
    <div class="sw" id="sw"></div>
    <div class="vals" id="vals"><span>Click the image to pick a colour.</span></div>
  </div>
  <h2 style="font-size:1rem;margin-top:1.25rem">Main colours</h2>
  <div class="main" id="main"></div>
  <p class="msg" id="msg" role="status"></p>
</main>
<script src="app.js"></script>
</body>
</html>
